[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  path = "/*"
  function = "ua_blocker_ef"

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
